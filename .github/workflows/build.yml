name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Smoke test NeoForge 21.1.247 (ATM10)
        id: smoke247
        continue-on-error: true
        run: scripts/smoke.sh 21.1.247

      - name: Smoke test NeoForge 21.1.251
        id: smoke251
        continue-on-error: true
        run: scripts/smoke.sh 21.1.251

      - name: Đẩy log lên nhánh ci-logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          echo "247=${{ steps.smoke247.outcome }} 251=${{ steps.smoke251.outcome }}" > /tmp/logs/result.txt
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Log run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Dừng nếu một trong hai bản NeoForge lỗi
        if: steps.smoke247.outcome != 'success' || steps.smoke251.outcome != 'success'
        run: exit 1

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: rbmk-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Cập nhật bản dev trên Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: RBMK Reactor (bản dev mới nhất)
          prerelease: true
          files: build/libs/*.jar
          body: Build tự động từ commit ${{ github.sha }}. Tải file .jar và thả vào thư mục mods của ATM10.
